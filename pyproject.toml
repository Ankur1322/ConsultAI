[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consultai"
version = "0.1.0"
description = "Local-first multi-agent business process analysis platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
]
graph = [
  "langgraph>=0.2,<1",
  "langgraph-checkpoint-postgres>=2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["consultai*"]
