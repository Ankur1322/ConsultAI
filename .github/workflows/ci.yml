name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "fastapi>=0.115,<1" "uvicorn[standard]>=0.30,<1" "pydantic>=2.8,<3" "psycopg[binary]>=3.2,<4" "presidio-analyzer>=2.2,<3" "presidio-anonymizer>=2.2,<3" "httpx>=0.27,<1" "pytest>=9.0.3,<10"
      - run: python -m pytest
      - run: python -m pip install pip-audit
      - run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
