services:
  api:
    build: .
    env_file: .env
    environment:
      CONSULTAI_STORAGE: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: consultai
      POSTGRES_USER: consultai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - consultai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultai -d consultai"]
      interval: 10s
      timeout: 5s
      retries: 5
  ollama:
    image: ollama/ollama:latest
    volumes:
      - consultai-ollama:/root/.ollama

volumes:
  consultai-postgres:
  consultai-ollama:
