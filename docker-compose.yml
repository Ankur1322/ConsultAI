services:
  api:
    build: .
    env_file: .env
    environment:
      CONSULTAI_STORAGE: postgres
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - ollama
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: consultai
      POSTGRES_USER: consultai
      POSTGRES_PASSWORD: consultai
    volumes:
      - consultai-postgres:/var/lib/postgresql/data
  ollama:
    image: ollama/ollama:latest
    volumes:
      - consultai-ollama:/root/.ollama

volumes:
  consultai-postgres:
  consultai-ollama:
